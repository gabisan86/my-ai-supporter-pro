<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業アイデア帳</title>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .back-link { position: absolute; top: 20px; left: 20px; padding: 10px 18px; background-color: #fff; border: 1px solid #e2e8f0; border-radius: 8px; color: #64748b; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .container { width: 95%; max-width: 550px; background: #fff; padding: 35px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 1rem; }
        input.error { border-color: #f87171; background-color: #fef2f2; }
        .add-btn { background: #10b981; color: white; border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; margin-top: 25px; }
        li { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .del-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>
    <div class="container">
        <h1>💡 副業アイデア帳</h1>
        <div class="input-group">
            <input type="text" id="ideaInput" placeholder="新しい副業の種を入力...">
            <button class="add-btn" id="addBtn">追加</button>
        </div>
        <ul id="ideaList"></ul>
    </div>
    <script>
        const input = document.getElementById('ideaInput');
        const list = document.getElementById('ideaList');
        document.getElementById('addBtn').addEventListener('click', () => {
            const val = input.value.trim();
            if (!val) { input.classList.add('error'); return; }
            input.classList.remove('error');
            const li = document.createElement('li');
            li.innerHTML = `<span>${val}</span><button class="del-btn" onclick="this.parentElement.remove()">削除</button>`;
            list.appendChild(li);
            input.value = '';
        });
    </script>
</body>
</html>
