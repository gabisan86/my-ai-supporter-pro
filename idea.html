<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業アイデア帳</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f4f8; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #334e68; margin-top: 10px; }
        .back-link { display: inline-block; padding: 8px 12px; background-color: #f8f9fa; color: #555; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; }
        input { width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #f9f9f9; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .delete-btn { background: #e74c3c; padding: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>
        <h1>💡 副業アイデア帳</h1>
        <input type="text" id="ideaInput" placeholder="新しいアイデアを入力...">
        <button id="addBtn">追加</button>
        <ul id="ideaList"></ul>
    </div>
    <script>
        const input = document.getElementById('ideaInput');
        const addBtn = document.getElementById('addBtn');
        const list = document.getElementById('ideaList');

        addBtn.addEventListener('click', () => {
            const val = input.value.trim();
            if (!val) { input.style.borderColor = 'red'; alert('⚠️ アイデアを入力してください'); return; }
            input.style.borderColor = '#ccc';
            const li = document.createElement('li');
            li.innerHTML = `${val} <button class="delete-btn" onclick="this.parentElement.remove()">削除</button>`;
            list.appendChild(li);
            input.value = '';
        });
    </script>
</body>
</html>
