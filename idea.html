<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>副業ネタ・アイデア帳</title>
    <style>
        body { font-family: sans-serif; background-color: #fff9e6; margin: 0; padding: 20px; color: #5d4037; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; font-size: 24px; margin-bottom: 30px; border-bottom: 2px solid #ffcc80; padding-bottom: 10px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .btn-add { background-color: #ffb74d; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .idea-list { list-style: none; padding: 0; }
        .idea-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 5px; border-radius: 5px; }
        .btn-del { background-color: #ef5350; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .back-link { display: block; margin-bottom: 20px; text-decoration: none; color: #8d6e63; font-size: 14px; }
    </style>
</head>
<body>

<a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>

<div class="container">
    <h1>副業ネタ・アイデア帳</h1>
    <div class="input-group">
        <input type="text" id="ideaInput" placeholder="例：ペットの悩み相談AI">
        <button class="btn-add" onclick="addIdea()">追加</button>
    </div>
    <ul id="ideaList" class="idea-list"></ul>
</div>

<script>
    // 1. 画面を開いた時に保存されたデータを読み込む
    window.onload = function() {
        const savedIdeas = JSON.parse(localStorage.getItem('myIdeas')) || [];
        savedIdeas.forEach(idea => displayIdea(idea));
    };

    // 2. アイデアを追加する
    function addIdea() {
        const input = document.getElementById('ideaInput');
        const text = input.value.trim();
        if (text === "") return;

        displayIdea(text);
        saveIdea(text);
        input.value = "";
    }

    // 3. 画面に表示する
    function displayIdea(text) {
        const list = document.getElementById('ideaList');
        const li = document.createElement('li');
        li.className = 'idea-item';
        li.innerHTML = `
            <span>${text}</span>
            <button class="btn-del" onclick="removeIdea(this, '${text}')">削除</button>
        `;
        list.appendChild(li);
    }

    // 4. ブラウザに保存する
    function saveIdea(text) {
        const savedIdeas = JSON.parse(localStorage.getItem('myIdeas')) || [];
        savedIdeas.push(text);
        localStorage.setItem('myIdeas', JSON.stringify(savedIdeas));
    }

    // 5. データを削除する
    function removeIdea(button, text) {
        // 画面から消す
        button.parentElement.remove();
        // 保存データから消す
        let savedIdeas = JSON.parse(localStorage.getItem('myIdeas')) || [];
        savedIdeas = savedIdeas.filter(idea => idea !== text);
        localStorage.setItem('myIdeas', JSON.stringify(savedIdeas));
    }
</script>

</body>
</html>
