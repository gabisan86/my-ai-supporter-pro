<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業収支シミュレーター</title>
    <style>
        body { font-family: sans-serif; transition: background-color 0.4s; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f2f5; }
        .back-link { position: absolute; top: 20px; left: 20px; padding: 10px 18px; background-color: #fff; border: 1px solid #d1d5db; border-radius: 8px; color: #4b5563; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .container { width: 90%; max-width: 450px; background: #fff; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: #111827; margin-bottom: 30px; font-size: 1.8rem; }
        .label { display: block; margin-bottom: 10px; font-weight: bold; color: #374151; }
        input { width: 100%; padding: 18px; margin-bottom: 25px; border: 1px solid #d1d5db; border-radius: 12px; box-sizing: border-box; font-size: 1.2rem; outline: none; }
        #result-box { padding: 30px; border-radius: 16px; text-align: center; background: #f9fafb; border: 1px solid #e5e7eb; }
        .wage-value { font-size: 2.2rem; font-weight: bold; color: #111827; margin-top: 10px; }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>
    <div class="container">
        <h1>💰 収支計算</h1>
        <span class="label">予想売上 (円)</span>
        <input type="number" id="income" placeholder="50000">
        <span class="label">作業時間 (時間)</span>
        <input type="number" id="hours" placeholder="10">
        <div id="result-box">
            <div id="result-text">推定時給</div>
            <div id="result-value" class="wage-value">¥0</div>
        </div>
    </div>
    <script>
        const incomeInput = document.getElementById('income');
        const hoursInput = document.getElementById('hours');
        const resultVal = document.getElementById('result-value');
        function calc() {
            const inc = parseFloat(incomeInput.value) || 0;
            const hrs = parseFloat(hoursInput.value) || 0;
            if (hrs > 0) {
                const wage = Math.round(inc / hrs);
                resultVal.innerText = `¥${wage.toLocaleString()}`;
                document.body.style.backgroundColor = wage >= 2000 ? "#ecfdf5" : "#fff7ed";
            } else {
                resultVal.innerText = "¥0";
                document.body.style.backgroundColor = "#f0f2f5";
            }
        }
        incomeInput.addEventListener('input', calc);
        hoursInput.addEventListener('input', calc);
    </script>
</body>
</html>
