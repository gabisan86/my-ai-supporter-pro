<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業収支シミュレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; transition: background-color 0.5s; }
        .container { max-width: 500px; margin: 0 auto; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 10px; }
        h1 { text-align: center; margin-top: 10px; }
        .back-link { display: inline-block; padding: 8px 12px; background-color: #f8f9fa; color: #555; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>
        <h1>💰 収支計算</h1>
        <input type="number" id="income" placeholder="売上額 (円)">
        <input type="number" id="hours" placeholder="作業時間 (時間)">
        <div id="result" style="text-align:center; font-weight:bold; font-size:1.2rem; margin-top:20px;">時給を計算します</div>
    </div>
    <script>
        const incomeInput = document.getElementById('income');
        const hoursInput = document.getElementById('hours');
        const resultDiv = document.getElementById('result');

        function calc() {
            const inc = parseFloat(incomeInput.value) || 0;
            const hrs = parseFloat(hoursInput.value) || 0;
            if (hrs > 0) {
                const wage = Math.round(inc / hrs);
                resultDiv.innerText = `推定時給: ${wage}円`;
                document.body.style.backgroundColor = wage >= 2000 ? "#e8f5e9" : "#fff3e0";
            }
        }
        incomeInput.addEventListener('input', calc);
        hoursInput.addEventListener('input', calc);
    </script>
</body>
</html>
