<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副業収支シミュレーター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fdf6e3;
            transition: background-color 0.4s;
            margin: 0;
            padding: 20px;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background-color: #ffffff;
            color: #4b5563;
            text-decoration: none;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 60px auto 0;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
            outline: none;
        }

        #result-box {
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            background: #f3f4f6;
            margin-top: 10px;
        }

        #result-text {
            font-size: 1rem;
            color: #4b5563;
            font-weight: bold;
        }

        .wage-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #111827;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>

    <div class="container">
        <h1>💰 収支計算</h1>

        <span class="label">予想売上 (円)</span>
        <input type="number" id="income" placeholder="例: 10000">

        <span class="label">作業時間 (時間)</span>
        <input type="number" id="hours" placeholder="例: 8">

        <div id="result-box">
            <div id="result-text">推定時給</div>
            <div id="result-value" class="wage-value">¥0</div>
        </div>
    </div>

    <script>
        const incomeInput = document.getElementById('income');
        const hoursInput = document.getElementById('hours');
        const resultVal = document.getElementById('result-value');

        function calc() {
            const inc = parseFloat(incomeInput.value) || 0;
            const hrs = parseFloat(hoursInput.value) || 0;

            if (hrs > 0) {
                const wage = Math.round(inc / hrs);
                resultVal.innerText = '¥' + wage.toLocaleString();

                // 時給2000円以上で背景を薄い緑、それ以外は元のベージュ
                if (wage >= 2000) {
                    document.body.style.backgroundColor = "#ecfdf5";
                } else {
                    document.body.style.backgroundColor = "#fdf6e3";
                }
            } else {
                resultVal.innerText = "¥0";
                document.body.style.backgroundColor = "#fdf6e3";
            }
        }

        incomeInput.addEventListener('input', calc);
        hoursInput.addEventListener('input', calc);
    </script>
</body>
</html>
