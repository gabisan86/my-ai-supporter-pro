<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>副業収支シミュレーター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; text-align: center; color: #2c3e50; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .result { margin-top: 20px; padding: 15px; background: #e8f6ef; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<a href="portfolio.html" style="text-decoration:none; color:#3498db;">← ポートフォリオに戻る</a>

<div class="container">
    <h1>副業収支シミュレーター</h1>
    
    <label>売上（円）</label>
    <input type="number" id="sales" placeholder="例: 5000">

    <label>経費（円）</label>
    <input type="number" id="costs" placeholder="例: 1000">

    <label>かかった時間（時間）</label>
    <input type="number" id="hours" placeholder="例: 2">

    <button onclick="calculate()">利益を計算する</button>

    <div id="resultArea" class="result">
        <strong>【診断結果】</strong><br>
        手残り利益： <span id="profitText"></span> 円
    </div>
</div>

<script>
function calculate() {
    const sales = document.getElementById('sales').value;
    const costs = document.getElementById('costs').value;
    const resultArea = document.getElementById('resultArea');
    const profitText = document.getElementById('profitText');

    const profit = sales - costs;
    
    profitText.innerText = profit.toLocaleString();
    resultArea.style.display = 'block';
}
</script>

</body>
</html>
