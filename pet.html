<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペット悩み相談AI</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; background-color: #f9fbf9; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2d5a27; font-size: 1.5rem; text-align: center; margin-top: 10px; }
        .back-link { display: inline-block; padding: 8px 12px; background-color: #f8f9fa; color: #555; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; transition: all 0.2s; }
        .back-link:hover { background-color: #eee; border-color: #ccc; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, textarea, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #4caf50; color: white; border: none; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <a href="portfolio.html" class="back-link">← ポートフォリオに戻る</a>
        <h1>🐾 ペット悩み相談AI</h1>
        <div class="form-group">
            <label for="petType">ペットの種類</label>
            <select id="petType">
                <option value="">選択してください</option>
                <option value="dog">犬</option>
                <option value="cat">猫</option>
                <option value="other">その他</option>
            </select>
        </div>
        <div class="form-group">
            <label for="consultation">相談内容</label>
            <textarea id="consultation" placeholder="（例）最近食欲がありません。"></textarea>
        </div>
        <button id="submitBtn">AIに相談する</button>
        <div id="result"></div>
    </div>
    <script>
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        submitBtn.addEventListener('click', () => {
            const petType = document.getElementById('petType').value;
            const text = document.getElementById('consultation').value.trim();
            if (petType === "" || text === "") {
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#ffebee';
                resultDiv.style.borderColor = '#ef5350';
                resultDiv.innerHTML = '⚠️ ペットの種類を選択し、内容を入力してください。';
                return;
            }
            let advice = petType === "dog" ? "🐶 ワンちゃんについての相談ですね。症状が続く場合は早めに獣医さんに相談しましょう。" : (petType === "cat" ? "🐱 ネコちゃんについての相談ですね。リラックスできる場所を確保して様子を見てあげてください。" : "🐾 ペットの様子を詳しく観察し、必要であれば専門家に相談しましょう。");
            resultDiv.style.display = 'block';
            resultDiv.style.backgroundColor = '#e8f5e9';
            resultDiv.style.borderColor = '#c8e6c9';
            resultDiv.innerHTML = `<strong>【AIアドバイス】</strong><br>${advice}<br><br>詳細: ${text}`;
        });
    </script>
</body>
</html>
